name: Release packages

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-14
            platform: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        shell: pwsh
        run: ./scripts/package-release.ps1 -Platform "${{ matrix.platform }}" -Arch "${{ matrix.arch }}" -OutputDir dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultTerminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/runtime-manifest-*.json
          if-no-files-found: error

      - name: Upload core plugin artifact
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: VaultTerminal-core
          path: |
            manifest.json
            main.js
            styles.css
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$TAG_NAME"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match manifest.json exactly, for example 0.3.1. Do not prefix with v." >&2
            exit 1
          fi

          if [ "$version" != "$manifest_version" ] || [ "$version" != "$package_version" ]; then
            echo "Tag version ($version), manifest.json ($manifest_version), and package.json ($package_version) must match." >&2
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: VaultTerminal-*-*
          path: dist
          merge-multiple: true

      - name: Download core plugin files
        uses: actions/download-artifact@v4
        with:
          name: VaultTerminal-core
          path: .

      - name: Build runtime manifest
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const version = require("./manifest.json").version;
          const dir = "dist";
          const fragments = fs.readdirSync(dir)
            .filter((name) => /^runtime-manifest-.+\.json$/.test(name))
            .map((name) => JSON.parse(fs.readFileSync(path.join(dir, name), "utf8")));

          if (fragments.length === 0) {
            throw new Error("No runtime manifest fragments found.");
          }

          fragments.sort((left, right) => {
            const leftKey = `${left.platform}-${left.arch}`;
            const rightKey = `${right.platform}-${right.arch}`;
            return leftKey.localeCompare(rightKey);
          });

          fs.writeFileSync("runtime-manifest.json", `${JSON.stringify({ version, runtimes: fragments }, null, 2)}\n`);
          NODE

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$TAG_NAME"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<NOTES
          ## Vault Terminal $version

          자동 빌드된 릴리스입니다.

          Community Plugin Directory용 파일:
          - manifest.json
          - main.js
          - styles.css
          - runtime-manifest.json

          포함 패키지:
          - Windows x64 전체 ZIP + 런타임 ZIP
          - macOS Intel x64 전체 ZIP + 런타임 ZIP
          - macOS Apple Silicon arm64 전체 ZIP + 런타임 ZIP

          기존 볼트에 업데이트한 뒤에는 Obsidian을 재시작하거나 플러그인을 껐다 켜고 Vault Terminal 탭을 새로 여세요.
          NOTES

          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" manifest.json main.js styles.css runtime-manifest.json dist/*.zip configure-corporate-ca.ps1 configure-corporate-ca.cmd --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" manifest.json main.js styles.css runtime-manifest.json dist/*.zip configure-corporate-ca.ps1 configure-corporate-ca.cmd --repo "$REPOSITORY" --title "Vault Terminal $version" --notes-file "$notes_file" --latest
          fi
